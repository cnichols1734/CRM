{# Single page-level upload dialog. Parent must host data-controller=document-upload-hub. #}
<dialog class="crm-document-upload-hub"
        data-document-upload-hub-target="dialog"
        aria-labelledby="tx-document-upload-hub-title">
    <form method="dialog" class="crm-document-upload-hub__panel" data-document-upload-hub-target="form" enctype="multipart/form-data">
        <div class="crm-document-upload-hub__header">
            <div class="min-w-0">
                <h2 id="tx-document-upload-hub-title" class="crm-document-upload-hub__title" data-document-upload-hub-target="title">Upload documents</h2>
                <p class="crm-document-upload-hub__lede" data-document-upload-hub-target="lede">PDFs are identified after upload.</p>
            </div>
            <button type="button"
                    class="crm-modal__close"
                    data-action="document-upload-hub#close"
                    data-document-upload-hub-target="closeButton"
                    aria-label="Close">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>

        <div class="crm-document-upload-hub__body">
            <div class="crm-document-upload-hub__fields" data-document-upload-hub-target="fields">
                <div>
                    <span class="crm-field-label" id="tx-hub-file-label">PDFs</span>
                    <label class="crm-upload-drop"
                           for="tx-hub-file"
                           data-document-upload-hub-target="dropzone">
                        <input id="tx-hub-file"
                               type="file"
                               name="files"
                               accept="application/pdf,.pdf"
                               multiple
                               required
                               class="sr-only"
                               data-document-upload-hub-target="file"
                               data-action="change->document-upload-hub#filesChanged"
                               aria-labelledby="tx-hub-file-label">
                        <span class="crm-upload-drop__icon" aria-hidden="true">
                            <i class="fas fa-file-arrow-up"></i>
                        </span>
                        <span class="crm-upload-drop__title">Drop PDFs here</span>
                        <span class="crm-upload-drop__hint" data-document-upload-hub-target="fileLabel">or choose files · 20 max, 25 MB each</span>
                    </label>
                </div>

                <div>
                    <label for="tx-hub-destination" class="crm-field-label">Destination</label>
                    <select id="tx-hub-destination"
                            name="scope"
                            class="crm-select"
                            data-document-upload-hub-target="scope"
                            data-action="change->document-upload-hub#scopeChanged">
                        <option value="other" selected>Auto-identify</option>
                        {% if (document_packages.side if document_packages else none) == 'seller' or (transaction.transaction_type and transaction.transaction_type.name == 'seller') %}
                        <option value="listing">Listing package</option>
                        {% elif (document_packages.side if document_packages else none) == 'buyer' or (transaction.transaction_type and transaction.transaction_type.name == 'buyer') %}
                        <option value="other">Buyer transaction</option>
                        {% endif %}
                        <option value="offer">Offer package</option>
                        <option value="contract">Controlling contract</option>
                        <option value="amendment">Amendment</option>
                    </select>
                </div>

                <div data-document-upload-hub-target="offerFields" class="hidden space-y-3">
                    <div>
                        <label for="tx-hub-offer-id" class="crm-field-label">Offer</label>
                        <select id="tx-hub-offer-id" name="offer_id" class="crm-select" data-document-upload-hub-target="offerSelect">
                            <option value="">Select an offer</option>
                            {% for offer in (seller_offers or []) %}
                            {% if offer.status not in ('withdrawn', 'expired') %}
                            <option value="{{ offer.id }}">
                                {{ offer.buyer_names or ('Offer #' ~ offer.id) }}
                                {% if offer.offer_price %} · ${{ '{:,.0f}'.format(offer.offer_price|float) }}{% endif %}
                            </option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <label class="flex min-h-11 items-center gap-2 text-sm text-[color:var(--ink-2)]">
                        <input type="checkbox"
                               name="create_new_offer"
                               value="true"
                               class="h-4 w-4 rounded border-[color:var(--hairline-strong)] text-[color:var(--accent)] focus:ring-[color:var(--accent)]"
                               data-document-upload-hub-target="createNewOffer"
                               data-action="change->document-upload-hub#createNewOfferChanged">
                        Start a new offer package
                    </label>
                </div>

                <div>
                    <label for="tx-hub-slug" class="crm-field-label">Document type</label>
                    <select id="tx-hub-slug" name="template_slug" class="crm-select" data-document-upload-hub-target="slug">
                        <option value="" selected>Auto-identify each file</option>
                        <option value="listing-agreement">Listing agreement (TXR-1101)</option>
                        <option value="one-to-four-family-contract">One to Four Family Contract (TREC 20)</option>
                        <option value="amendment">Amendment (TREC 39)</option>
                        <option value="hoa-addendum">HOA / POA Addendum (TREC 36)</option>
                        <option value="third-party-financing-addendum">Third Party Financing Addendum (TREC 40)</option>
                        <option value="sellers-disclosure">Seller's Disclosure</option>
                        <option value="pre-approval-or-proof-of-funds">Pre-approval / Proof of funds</option>
                    </select>
                </div>

                <p class="hidden text-sm text-[color:var(--danger)]" role="alert" data-document-upload-hub-target="error"></p>
                <p class="hidden text-sm text-[color:var(--ink-2)]" role="status" aria-live="polite" data-document-upload-hub-target="status"></p>
            </div>

            <div class="crm-document-upload-hub__processing hidden" data-document-upload-hub-target="processing">
                <div class="crm-document-upload-hub__spinner" aria-hidden="true"></div>
                <p class="crm-document-upload-hub__processing-status"
                   id="tx-document-upload-hub-processing"
                   role="status"
                   aria-live="polite"
                   data-document-upload-hub-target="processingStatus">Uploading…</p>
            </div>
        </div>

        <div class="crm-document-upload-hub__footer" data-document-upload-hub-target="footer">
            <button type="button" class="crm-btn crm-btn-secondary" data-action="document-upload-hub#close">Cancel</button>
            <button type="button" class="crm-btn crm-btn-accent" data-action="document-upload-hub#submit" data-document-upload-hub-target="submit">
                Upload PDFs
            </button>
        </div>
    </form>
</dialog>
