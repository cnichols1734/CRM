<div id="listing-dates" class="scroll-mt-28">
    <h3 class="text-sm font-semibold text-slate-900">Listing dates</h3>
    <p class="mt-1 text-xs text-slate-500">These dates describe the listing agreement and marketing plan. Agent edits update the client schedule without changing the signed document.</p>
    <div class="mt-3 divide-y divide-slate-100">
        {% for field in listing_date_fields %}
        <form data-listing-date-form data-field="{{ field.key }}" class="flex flex-wrap items-end gap-3 py-3">
            <label class="min-w-48 flex-1">
                <span class="block text-sm font-medium text-slate-900">{{ field.label }}</span>
                <span class="mt-1 block text-xs text-slate-500">{{ field.source }}{% if field.manual %}. Stays fixed until reset.{% endif %}</span>
                <input type="date" name="value" class="crm-input mt-2" value="{{ field.value }}" aria-label="{{ field.label }}">
            </label>
            <button type="submit" class="crm-btn crm-btn-secondary">Save date</button>
            {% if field.manual %}<button type="button" class="crm-btn crm-btn-ghost" data-listing-date-reset>Use source date</button>{% endif %}
        </form>
        {% endfor %}
    </div>
</div>
