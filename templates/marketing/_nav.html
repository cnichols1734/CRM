<div class="mkt-navigation">
    <nav class="crm-segment mkt-work-nav" aria-label="Marketing">
        {% for href, label, active in [(url_for('marketing.campaigns_list'), 'Campaigns', nav in ('campaigns', 'finished', 'drafts', 'sent')), (url_for('marketing.library', flow='template'), 'Templates', nav == 'templates')] %}
        <a class="crm-segment__item {% if active %}is-active{% endif %}" href="{{ href }}" {% if active %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>
    <a class="crm-link mkt-settings-link" href="{{ url_for('marketing.settings') }}" {% if nav == 'settings' %}aria-current="page"{% endif %}>Settings</a>
</div>
